
services:
  mongodb:
    image: mongo:8.0
    container_name: cricket-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongodb_data:/data/db

  qdrant:
    image: qdrant/qdrant:latest
    container_name: cricket-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  django:
    build: .
    container_name: cricket-django
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://host.docker.internal:11434/api/chat
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mongodb_data:
  qdrant_data:

